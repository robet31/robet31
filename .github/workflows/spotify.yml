name: Spotify Recently Played

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-spotify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Recently Played
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          response=$(curl -s -X POST "https://accounts.spotify.com/api/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=refresh_token&refresh_token=$SPOTIFY_REFRESH_TOKEN&client_id=$SPOTIFY_CLIENT_ID&client_secret=$SPOTIFY_CLIENT_SECRET")

          access_token=$(echo "$response" | jq -r '.access_token')
          if [ -z "$access_token" ] || [ "$access_token" = "null" ]; then
            echo "Failed to get token"
            exit 1
          fi

          recent=$(curl -s -X GET "https://api.spotify.com/v1/me/player/recently-played?limit=1" \
            -H "Authorization: Bearer $access_token")

          item=$(echo "$recent" | jq -r '.items[0]')
          if [ "$item" = "null" ] || [ -z "$item" ]; then
            new_block="### 🎧 Recently Played\n📻 _No tracks found_"
          else
            song=$(echo "$recent" | jq -r '.items[0].track.name')
            artist=$(echo "$recent" | jq -r '.items[0].track.artists | map(.name) | join(", ")')
            album=$(echo "$recent" | jq -r '.items[0].track.album.name')
            url=$(echo "$recent" | jq -r '.items[0].track.external_urls.spotify')
            album_art=$(echo "$recent" | jq -r '.items[0].track.album.images[0].url')

            new_block="### 🎧 Recently Played\n\n<a href=\"$url\"><img src=\"$album_art\" width=\"64\" align=\"left\" style=\"margin-right: 12px\" /></a>\n\n**[$song]($url)**\nby *$artist*\n\n---"
          fi

          readme=$(cat README.md)
          new_readme=$(echo "$readme" | awk -v new="$new_block" '
            /<!-- spotify:start -->/ { print; print new; in_block=1; next }
            /<!-- spotify:end -->/ { in_block=0; print; next }
            in_block { next }
            { print }
          ')

          echo "$new_readme" > README.md

      - name: Commit & Push
        run: |
          git config user.name "robet31"
          git config user.email "sopoh006@gmail.com"
          git diff --quiet README.md || {
            git add README.md
            git commit -m "chore: update recently played"
            git push
          }