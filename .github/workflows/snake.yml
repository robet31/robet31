name: Generate Snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: robet31
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: Push to output branch
        run: |
          git config user.name "robet31"
          git config user.email "sopoh006@gmail.com"
          git checkout --orphan output
          git reset --hard
          cp -r dist/* .
          git add .
          git commit -m "chore: generate snake SVG"
          git push origin output --force
