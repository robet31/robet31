name: Spotify Now Playing

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-spotify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Spotify Now Playing
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          # Get access token
          response=$(curl -s -X POST "https://accounts.spotify.com/api/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=refresh_token&refresh_token=$SPOTIFY_REFRESH_TOKEN&client_id=$SPOTIFY_CLIENT_ID&client_secret=$SPOTIFY_CLIENT_SECRET")

          access_token=$(echo "$response" | jq -r '.access_token')
          if [ -z "$access_token" ] || [ "$access_token" = "null" ]; then
            echo "Failed to get token"
            exit 1
          fi

          # Get currently playing
          playing=$(curl -s -X GET "https://api.spotify.com/v1/me/player/currently-playing" \
            -H "Authorization: Bearer $access_token")

          item=$(echo "$playing" | jq -r '.item')
          if [ "$item" = "null" ] || [ -z "$item" ]; then
            new_block="### 🎧 Now Playing\n📻 _Not listening right now_"
          else
            song=$(echo "$playing" | jq -r '.item.name')
            artist=$(echo "$playing" | jq -r '.item.artists | map(.name) | join(", ")')
            album=$(echo "$playing" | jq -r '.item.album.name')
            url=$(echo "$playing" | jq -r '.item.external_urls.spotify')
            album_art=$(echo "$playing" | jq -r '.item.album.images[0].url')
            progress=$(echo "$playing" | jq -r '.progress_ms')
            duration=$(echo "$playing" | jq -r '.item.duration_ms')
            pct=$((progress * 100 / duration))

            new_block="### 🎧 Now Playing\n\n<a href=\"$url\"><img src=\"$album_art\" width=\"80\" align=\"left\" /></a>\n\n**[$song]($url)** by **$artist**\n\n\`\`\`\n$(printf '%*s' $pct | tr ' ' '█')$(printf '%*s' $((100 - pct)) | tr ' ' '░')\n\`\`\`\n\n---"
          fi

          # Read README
          readme=$(cat README.md)

          # Replace content between markers
          new_readme=$(echo "$readme" | awk -v new="$new_block" '
            /<!-- spotify:start -->/ { print; print new; in_block=1; next }
            /<!-- spotify:end -->/ { in_block=0; print; next }
            in_block { next }
            { print }
          ')

          echo "$new_readme" > README.md

      - name: Commit & Push
        run: |
          git config user.name "robet31"
          git config user.email "sopoh006@gmail.com"
          git diff --quiet README.md || {
            git add README.md
            git commit -m "chore: update now playing"
            git push
          }